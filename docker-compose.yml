services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sticker_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: sticker_vector_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sticker_vector_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
