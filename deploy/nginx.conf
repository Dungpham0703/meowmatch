limit_req_zone $binary_remote_addr zone=search_per_ip:10m rate=10r/m;
limit_req_zone $server_name zone=search_global:1m rate=1r/s;
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 8k;
    limit_req_status 429;

    location /api/search {
        limit_req zone=search_per_ip burst=5 nodelay;
        limit_req zone=search_global burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
